[package]
name    = "iqdb-eval"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.87"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Benchmarking and evaluation: recall@k, latency, and throughput for vector indexes - part of the iQDB family."

# Keywords (5 max)
keywords = [
    "benchmark",
    "vector-search",
    "recall",
    "evaluation",
    "iqdb"
]

# Categories
categories = [
    "development-tools::profiling",
    "science"
]

# Links
homepage      = "https://github.com/jamesgober/iqdb-eval"
repository    = "https://github.com/jamesgober/iqdb-eval"
documentation = "https://docs.rs/iqdb-eval"

# Authors
authors = [
    "James Gober <me@jamesgober.com>",
    "Matt Callahan <matthewcallahan01@icloud.com>"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "iqdb_eval"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
# Default build: pure measurement surface, no optional dependencies.
default = []
# Derive `serde::Serialize` / `Deserialize` on the report types.
serde = ["dep:serde"]


# DEPENDENCIES
# #################################
[dependencies]
# Shared iQDB vocabulary: VectorId, SearchParams, DistanceMetric, Hit, IqdbError.
iqdb-types  = "1.0.0"
# The Index / IndexCore traits the harness is generic over.
iqdb-index  = "1.0.0"
# Exact brute-force search — the ground-truth oracle for recall@k.
iqdb-flat   = "1.0.0"
# `ForgeError` trait: gives `EvalError` the same `kind()` / `caption()` surface
# `IqdbError` carries, so the two compose into one structured-error event.
error-forge = "1.0.0"
# Tracing facade only — one `info_span!` per top-level public function; the
# per-query measurement loop carries no tracing call.
tracing     = { version = "0.1", default-features = false, features = ["attributes", "std"] }
# Optional, additive serialization for the report types.
serde       = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Property-based tests for the harness invariants.
proptest   = "1"
# serde round-trip coverage in tests/serde_roundtrip.rs (under `--all-features`).
serde_json = "1"
# Real approximate index for cross-crate validation on the SIFT corpus.
# DEV-only: iqdb-eval must not depend on a concrete ANN index at runtime.
iqdb-hnsw  = "1.0.0"
# Hot-path benchmarks for the recall and latency measurement loops.
criterion  = { version = "0.5", features = ["html_reports"] }


# BENCHMARKS
# #################################
[[bench]]
name    = "eval_bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
